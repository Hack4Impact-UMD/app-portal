name: Full Deploy to Firebase on merge
on:
  push:
    branches:
      - main
env:
  GOOGLE_APPLICATION_CREDENTIALS: /tmp/credentials.json
  VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
  VITE_RECAPTCHA_SITE_KEY: ${{ secrets.VITE_RECAPTCHA_SITE_KEY }}
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: ${{ secrets.GCP_REGION }}
  CLOUD_TASKS_QUEUE_NAME: ${{ secrets.CLOUD_TASKS_QUEUE_NAME }}
  PROFESSOR_SERVICE_URL: ${{ secrets.PROFESSOR_SERVICE_URL }}
  QUEUE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.QUEUE_SERVICE_ACCOUNT_EMAIL }}
jobs:
  deploy_firebase:
    name: Deploy to Firebase Project
    runs-on: ubuntu-latest
    env:
      GOOGLE_APPLICATION_CREDENTIALS: /tmp/credentials.json
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Firebase CLI
        run: pnpm i -g firebase-tools

      - name: Create GAC File
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_H4I_APPLICATIONS }}' > $GOOGLE_APPLICATION_CREDENTIALS

      - name: Write build commit hash to env
        run: echo "VITE_COMMIT=$(git rev-parse HEAD)" >> $GITHUB_ENV

      - name: Build All Packages
        run: pnpm build

      # Firebase reads runtime env from a .env file in the functions source dir.
      # That dir is regenerated by the isolate predeploy (which packs
      # backend/functions and respects its package.json "files" array), so the
      # .env must live in backend/functions and be listed in "files" to be
      # carried into the deployed bundle where cloudTasks.ts can read it.
      - name: Write Cloud Functions runtime env
        run: |
          cat > backend/functions/.env <<EOF
          GCP_PROJECT_ID=${GCP_PROJECT_ID}
          GCP_REGION=${GCP_REGION}
          CLOUD_TASKS_QUEUE_NAME=${CLOUD_TASKS_QUEUE_NAME}
          PROFESSOR_SERVICE_URL=${PROFESSOR_SERVICE_URL}
          QUEUE_SERVICE_ACCOUNT_EMAIL=${QUEUE_SERVICE_ACCOUNT_EMAIL}
          EOF

      - name: Deploy to Firebase
        run: firebase deploy
